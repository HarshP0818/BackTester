# Configuration: Aggressive Kelly Criterion Sizing
# Optimal position sizing based on strategy statistics

backtest:
  initial_cash: 100000
  commission: 0.001
  slippage: 0.0005
  position_sizing_strategy: "kelly_criterion"
  risk_percent_per_trade: 0.05  # Higher risk tolerance

position_sizing:
  kelly_criterion:
    kelly_fraction: 0.25  # Use 1/4 Kelly for safety
    # These will be calculated from backtest results in production
    win_rate: 0.55
    avg_win: 0.025
    avg_loss: 0.015

strategy:
  name: "moving_average_crossover"
  fast_window: 15  # Shorter MA for faster signals
  slow_window: 45

data:
  ticker: GOOGL
  start_date: "2019-01-01"
  end_date: "2021-12-31"

database:
  host: localhost
  port: 5432
  database: stock_data
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  connection_pool_size: 5
  max_overflow: 10
  pool_recycle: 3600

logging:
  level: DEBUG  # More verbose logging
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/backtester_kelly.log"
  max_file_size: 10485760
  backup_count: 5
